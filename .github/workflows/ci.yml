name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    # Run on macOS too so the Seatbelt containment tests (packages/agentd/test/sandbox.test.ts)
    # actually execute: they self-gate on a real `sandbox-exec` probe (canApplySeatbelt), which
    # passes on GitHub's non-nested macOS runners and skips everywhere else — so the macOS job can
    # only add coverage, never turn CI red.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
