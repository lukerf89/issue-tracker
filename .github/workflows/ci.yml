name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    # Run the suite on macOS as well as Linux. Most of this repo is platform-agnostic, but the
    # agentd supervisor shells out to the OS (process spawning, temp dirs, worktree file locks) and
    # macOS is the primary dev platform, so Linux-only CI leaves those paths unverified where they
    # are most used. fail-fast: false keeps a failure on one OS from cancelling the other leg.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
